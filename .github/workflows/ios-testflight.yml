name: iOS TestFlight

# Compila Intonia per iOS su un runner macOS e carica la build su TestFlight.
# Si avvia solo a mano: Actions → iOS TestFlight → Run workflow.
# Firma automatica gestita da Apple ("cloud signing") tramite una chiave API di
# App Store Connect: nessun certificato o profilo nel repository.
# Secret richiesti (Settings → Secrets and variables → Actions), vedi
# docs/BUILD_AND_RELEASE.md:
#   APP_STORE_CONNECT_API_KEY_ID, APP_STORE_CONNECT_ISSUER_ID,
#   APP_STORE_CONNECT_API_KEY_P8, APPLE_TEAM_ID
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.44.3

jobs:
  testflight:
    name: Build e upload TestFlight
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Numero di build crescente a ogni esecuzione di questo workflow.
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Verifica secret
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret mancante per $name (vedi docs/BUILD_AND_RELEASE.md)"
              missing=1
            fi
          done
          exit $missing

      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Versioni strumenti
        run: |
          xcodebuild -version
          flutter --version

      - name: Dipendenze
        run: flutter pub get --enforce-lockfile

      - name: Chiave API App Store Connect
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey.p8"

      # Genera la configurazione Xcode (Generated.xcconfig, Podfile, pod install)
      # con il numero di build di questo run. --no-codesign: Flutter non deve
      # cercare certificati nel portachiavi del runner; la firma avviene dopo,
      # in xcodebuild, con la chiave API di App Store Connect.
      - name: Configurazione Flutter per iOS
        run: flutter build ios --release --config-only --no-codesign --build-number="$BUILD_NUMBER"

      - name: Archive
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic

      - name: Export e upload su App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Build $BUILD_NUMBER caricata: comparirà in TestFlight dopo l'elaborazione di Apple."

      - name: Rimuovi chiave API
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
