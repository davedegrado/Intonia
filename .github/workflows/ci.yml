name: CI

# Controlli automatici: formattazione, analisi statica, test e un APK di test
# scaricabile dagli artifact del run (firmato con la chiave debug: non
# pubblicabile). Nessun segreto, nessuna pubblicazione.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Versione Flutter con cui è stato creato il progetto (.metadata) e
  # generato pubspec.lock.
  FLUTTER_VERSION: 3.44.3

jobs:
  analyze-and-test:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Dipendenze
        run: flutter pub get --enforce-lockfile

      - name: Formattazione
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analisi statica
        run: flutter analyze

      - name: Test
        run: flutter test

  android-build:
    name: Build Android (APK di test)
    runs-on: ubuntu-latest
    needs: analyze-and-test
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Dipendenze
        run: flutter pub get --enforce-lockfile

      # Chiave debug stabile tra i run: senza, ogni APK è firmato con una
      # chiave diversa e Android rifiuta di installarlo sopra il precedente
      # ("App non installata"). La chiave nasce al primo build ed è riusata
      # dai run successivi (le PR leggono quella salvata da main).
      - name: Chiave debug persistente
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      # APK in modalità release (il riconoscimento del pitch in debug è troppo
      # lento per prove realistiche), firmato con la chiave debug perché la
      # upload key non è in CI: installabile per i test, NON pubblicabile.
      - name: Build APK di test
        env:
          INTONIA_ALLOW_DEBUG_SIGNED_RELEASE: 'true'
        run: flutter build apk --release

      - name: Rinomina APK
        run: mv build/app/outputs/flutter-apk/app-release.apk "intonia-test-${GITHUB_SHA::7}.apk"

      - name: Carica APK
        uses: actions/upload-artifact@v4
        with:
          name: intonia-test-apk
          path: intonia-test-*.apk
          if-no-files-found: error
          retention-days: 14
