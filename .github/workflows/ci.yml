name: CI

# Controlli automatici: formattazione, analisi statica, test e una build
# Android debug (nessun segreto, nessun signing, nessuna pubblicazione).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Versione Flutter con cui è stato creato il progetto (.metadata) e
  # generato pubspec.lock.
  FLUTTER_VERSION: 3.44.3

jobs:
  analyze-and-test:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Dipendenze
        run: flutter pub get --enforce-lockfile

      - name: Formattazione
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analisi statica
        run: flutter analyze

      - name: Test
        run: flutter test

  android-debug-build:
    name: Build Android (debug)
    runs-on: ubuntu-latest
    needs: analyze-and-test
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Dipendenze
        run: flutter pub get --enforce-lockfile

      - name: Build APK debug
        run: flutter build apk --debug
