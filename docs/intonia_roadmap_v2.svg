<svg viewBox="0 0 1280 680" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Segoe UI', -apple-system, sans-serif">
<title>Roadmap Intonia v2 — con Karaoke Mode</title>
<rect x="0" y="0" width="1280" height="680" fill="#F9F9F7"/>

<text x="60" y="52" fill="#0B0B0B" font-size="28" font-weight="700">Roadmap Intonia — v2</text>
<text x="60" y="78" fill="#52514E" font-size="15">Dalla base tecnica alla pubblicazione, con il Karaoke Mode in rotta</text>

<!-- timeline -->
