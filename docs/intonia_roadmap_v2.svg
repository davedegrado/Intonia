<text x="965" y="320" fill="#52514E" font-size="12.5">• Asset store, privacy policy</text>

<!-- Futuro -->
<circle cx="1200" cy="150" r="16" fill="none" stroke="#898781" stroke-width="2" stroke-dasharray="3 4"/>
