<text x="505" y="364" fill="#52514E" font-size="12.5">estrazione melodia (ML)</text>

<!-- K Karaoke Mode (evidenziato) -->
<circle cx="810" cy="150" r="24" fill="#F9F9F7" stroke="#6D28D9" stroke-width="3"/>
