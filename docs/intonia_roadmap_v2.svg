<line x1="1040" y1="150" x2="1160" y2="150" stroke="#0B0B0B" stroke-opacity="0.1" stroke-width="2" stroke-dasharray="4 5"/>

<!-- 1 Fondamenta: FATTO -->
<circle cx="120" cy="150" r="24" fill="#184F95"/>
<path d="M109 150 l8 8 l16 -18" stroke="#F9F9F7" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="30" y="200" width="200" height="180" rx="10" fill="#FCFCFB" stroke="#0B0B0B" stroke-opacity="0.1"/>
