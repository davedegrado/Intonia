<text x="45" y="256" fill="#0B0B0B" font-size="17" font-weight="700">Fondamenta</text>
<text x="45" y="280" fill="#52514E" font-size="12.5">• Pitch engine (YIN + fry)</text>
<text x="45" y="300" fill="#52514E" font-size="12.5">• Libreria + editor custom</text>
<text x="45" y="320" fill="#52514E" font-size="12.5">• Test estensione vocale</text>
<text x="45" y="340" fill="#52514E" font-size="12.5">• Nuova icona app</text>

