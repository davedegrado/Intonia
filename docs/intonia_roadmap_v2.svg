<text x="735" y="280" fill="#52514E" font-size="12.5">• K1: karaoke da file locali</text>
<text x="735" y="300" fill="#52514E" font-size="12.5">(melody track on-device,</text>
<text x="735" y="320" fill="#52514E" font-size="12.5">piano-roll, scoring)</text>
<text x="735" y="344" fill="#52514E" font-size="12.5">• K2: report + esercizi</text>
<text x="735" y="364" fill="#52514E" font-size="12.5">suggeriti dagli errori</text>
<text x="735" y="388" fill="#52514E" font-size="12.5">• K3: UltraStar / YouTube</text>
<text x="735" y="408" fill="#52514E" font-size="12.5">(da validare, opz.)</text>

