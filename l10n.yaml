# Localizzazione dell'interfaccia con gen_l10n.
# Inglese = lingua di riferimento (e di fallback). Per aggiungere una lingua
# basta creare lib/l10n/app_<codice>.arb con tutte le chiavi.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
